<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demon RPG</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>

    <audio id="track1" src="asset/music/gamev1.mp3" loop preload="auto"></audio>
    <audio id="track2" src="asset/music/gamev2.mp3" loop preload="auto"></audio>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        const PATHS = {
            background: "asset/world/лес.png",
            up: "asset/sprite/demon/вверх.png",
            down: "asset/sprite/demon/вниз.png",
            left: "asset/sprite/demon/лево.png",
            right: "asset/sprite/demon/право.png"
        };

        const bgImage = new Image();
        bgImage.src = PATHS.background;

        const demonSprites = {
            w: new Image(), s: new Image(), a: new Image(), d: new Image()
        };
        demonSprites.w.src = PATHS.up;
        demonSprites.s.src = PATHS.down;
        demonSprites.a.src = PATHS.left;
        demonSprites.d.src = PATHS.right;
        
        let bgMusic = null;
        let isMusicPlaying = false;

        const player = {
            x: 100, y: 100, targetHeight: 100, speed: 5, currentDirection: "s"
        };

        const keys = {};

        function getDirection(key) {
            if (key === "w" || key === "ц") return "w";
            if (key === "s" || key === "ы") return "s";
            if (key === "a" || key === "ф") return "a";
            if (key === "d" || key === "в") return "d";
            return null;
        }

        window.addEventListener("keydown", (e) => {
            const dir = getDirection(e.key.toLowerCase());
            if (dir) {
                keys[dir] = true;
                player.currentDirection = dir;

                // Запускаем музыку при первом нажатии
                if (!isMusicPlaying) {
                    isMusicPlaying = true;
                    
                    // Выбираем случайный трек: "track1" или "track2"
                    const trackId = Math.random() < 0.5 ? "track1" : "track2";
                    bgMusic = document.getElementById(trackId);
                    bgMusic.volume = 0.4;
                    
                    bgMusic.play().catch(err => {
                        // Если выскочит ошибка, она появится на экране!
                        alert("ОШИБКА МУЗЫКИ:\n" + err.message + "\n\nПроверь, лежат ли файлы в asset/music/ и называются ли они gamev1.mp3");
                        isMusicPlaying = false; 
                    });
                }
            }
        });

        window.addEventListener("keyup", (e) => {
            const dir = getDirection(e.key.toLowerCase());
            if (dir && keys[dir]) {
                keys[dir] = false;
            }
        });

        function update() {
            if (keys["w"]) player.y -= player.speed;
            if (keys["s"]) player.y += player.speed;
            if (keys["a"]) player.x -= player.speed;
            if (keys["d"]) player.x += player.speed;

            const activeSprite = demonSprites[player.currentDirection];
            if (activeSprite && activeSprite.complete) {
                const aspectRatio = activeSprite.width / activeSprite.height;
                const playerWidth = player.targetHeight * aspectRatio;
                const playerHeight = player.targetHeight;

                if (player.x < 0) player.x = 0;
                if (player.y < 0) player.y = 0;
                if (player.x > canvas.width - playerWidth) player.x = canvas.width - playerWidth;
                if (player.y > canvas.height - playerHeight) player.y = canvas.height - playerHeight;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (bgImage.complete && bgImage.width > 0) {
                ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = "#2e5c1e";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            const activeSprite = demonSprites[player.currentDirection];
            if (activeSprite && activeSprite.complete && activeSprite.width > 0) {
                const aspectRatio = activeSprite.width / activeSprite.height;
                const playerWidth = player.targetHeight * aspectRatio;
                const playerHeight = player.targetHeight;
                ctx.drawImage(activeSprite, player.x, player.y, playerWidth, playerHeight);
            } else {
                // Если картинка "вниз" не загрузилась, тут будет красный квадрат
                ctx.fillStyle = "red";
                ctx.fillRect(player.x, player.y, 64, player.targetHeight);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
