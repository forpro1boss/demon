<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demon RPG</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        /* Наша секретная школьная консоль */
        #schoolConsole {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: calc(100% - 20px);
            max-height: 150px;
            background: rgba(0, 0, 0, 0.8);
            color: #ff3333;
            font-family: monospace;
            font-size: 14px;
            padding: 10px;
            overflow-y: auto;
            border: 1px solid #ff0000;
            z-index: 9999;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="schoolConsole">Консоль запущена. Ошибок пока нет...</div>
    <canvas id="gameCanvas"></canvas>

    <script>
        // Функция для вывода ошибок на экран
        function showError(text) {
            const consoleDiv = document.getElementById("schoolConsole");
            if (consoleDiv.innerHTML.includes("Ошибок пока нет")) {
                consoleDiv.innerHTML = "";
            }
            consoleDiv.innerHTML += "[ОШИБКА] " + text + "<br>";
        }

        // Перехватываем системные ошибки браузера
        window.onerror = function(message, source, lineno, colno, error) {
            showError(message + " (Линия: " + lineno + ")");
            return false;
        };

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        // Пути без папок и на латинице
        const PATHS = {
            background: "les.png",
            up: "vverh.png",
            down: "vniz.png",
            left: "levo.png",
            right: "pravo.png"
        };

        const bgImage = new Image();
        bgImage.src = PATHS.background;
        bgImage.onerror = () => showError("Не удалось загрузить карту 'les.png'. Проверь имя файла на GitHub!");

        const demonSprites = {
            w: new Image(), s: new Image(), a: new Image(), d: new Image()
        };
        demonSprites.w.src = PATHS.up;
        demonSprites.s.src = PATHS.down;
        demonSprites.a.src = PATHS.left;
        demonSprites.d.src = PATHS.right;

        // Проверяем загрузку спрайтов
        Object.keys(demonSprites).forEach(key => {
            demonSprites[key].onerror = () => showError(`Не удалось загрузить спрайт для кнопки '${key}'. Проверь файлы демона!`);
        });

        const musicFiles = [
            "gamev1.mp3",
            "gamev2.mp3"
        ];
        
        let bgMusic = null;
        let isMusicPlaying = false;

        const player = {
            x: 100, y: 100, targetHeight: 100, speed: 5, currentDirection: "s"
        };

        const keys = {};

        window.addEventListener("keydown", (e) => {
            const key = e.key.toLowerCase();
            if (["w", "a", "s", "d", "ц", "ы", "ф", "в"].includes(key)) {
                let dir = key;
                if (key === "ц") dir = "w";
                if (key === "ы") dir = "s";
                if (key === "ф") dir = "a";
                if (key === "в") dir = "d";

                keys[dir] = true;
                player.currentDirection = dir;

                if (!isMusicPlaying) {
                    isMusicPlaying = true;
                    try {
                        const randomIndex = Math.floor(Math.random() * musicFiles.length);
                        bgMusic = new Audio(musicFiles[randomIndex]);
                        bgMusic.loop = true;
                        bgMusic.volume = 0.4;
                        
                        bgMusic.play().catch(err => {
                            showError("Музыка заблокирована браузером. Кликни по экрану игры мышкой!");
                            isMusicPlaying = false;
                        });
                        
                        bgMusic.onerror = () => showError(`Ошибка загрузки музыки: ${musicFiles[randomIndex]}. Проверь mp3 файлы!`);
                    } catch (e) {
                        showError("Критическая ошибка аудио: " + e.message);
                    }
                }
            }
        });

        window.addEventListener("keyup", (e) => {
            const key = e.key.toLowerCase();
            let dir = key;
            if (key === "ц") dir = "w";
            if (key === "ы") dir = "s";
            if (key === "ф") dir = "a";
            if (key === "в") dir = "d";
            if (keys[dir]) keys[dir] = false;
        });

        function update() {
            if (keys["w"]) player.y -= player.speed;
            if (keys["s"]) player.y += player.speed;
            if (keys["a"]) player.x -= player.speed;
            if (keys["d"]) player.x += player.speed;

            const activeSprite = demonSprites[player.currentDirection];
            if (activeSprite && activeSprite.complete) {
                const aspectRatio = activeSprite.width / activeSprite.height;
                const playerWidth = player.targetHeight * aspectRatio;
                const playerHeight = player.targetHeight;

                if (player.x < 0) player.x = 0;
                if (player.y < 0) player.y = 0;
                if (player.x > canvas.width - playerWidth) player.x = canvas.width - playerWidth;
                if (player.y > canvas.height - playerHeight) player.y = canvas.height - playerHeight;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (bgImage.complete) {
                ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = "#2e5c1e";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            const activeSprite = demonSprites[player.currentDirection];
            if (activeSprite && activeSprite.complete) {
                const aspectRatio = activeSprite.width / activeSprite.height;
                const playerWidth = player.targetHeight * aspectRatio;
                const playerHeight = player.targetHeight;
                ctx.drawImage(activeSprite, player.x, player.y, playerWidth, playerHeight);
            } else {
                ctx.fillStyle = "red";
                ctx.fillRect(player.x, player.y, 64, player.targetHeight);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
